name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch:       # Manual trigger from Actions tab
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ── Left column: main overview ──
      - name: General metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: pattty847
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York

          # Languages breakdown
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          # Isometric commit calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Lines of code changed
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_sections: base

      # ── Right column: traffic + repos ──
      - name: Traffic and repositories
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-extras.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: pattty847
          template: classic
          base: ""
          config_timezone: America/New_York

          # Traffic stats (views, clones)
          plugin_traffic: yes

          # Starred repos (what you find interesting)
          plugin_stars: yes
          plugin_stars_limit: 4

          # Pinned/featured repositories
          plugin_repositories: yes
          plugin_repositories_pinned: 4
          plugin_repositories_featured: pattty847/Sentinel

          # Notable contributions
          plugin_notable: yes
          plugin_notable_repositories: yes
